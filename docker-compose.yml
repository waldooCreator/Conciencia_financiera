version: '3.8'

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: finanzas_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finanzas_db}
      POSTGRES_USER: ${POSTGRES_USER:-finanzas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finanzas_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - finanzas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finanzas_user}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: finanzas_backend
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app
    ports:
      - "8000:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DATABASE_URL=${DATABASE_URL}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finanzas_network

  # Redis (for Celery if needed)
  redis:
    image: redis:7-alpine
    container_name: finanzas_redis
    ports:
      - "6379:6379"
    networks:
      - finanzas_network

networks:
  finanzas_network:
    driver: bridge

volumes:
  postgres_data:
