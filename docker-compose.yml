version: '3.8'

# ==========================================
# Docker Compose - Finanzas Personales
# Optimizado para WSL 2 y desarrollo fluido
# ==========================================

services:
  # PostgreSQL Database
  db:
    image: postgres:15-alpine
    container_name: finanzas_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-finanzas_db}
      POSTGRES_USER: ${POSTGRES_USER:-finanzas_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-finanzas_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - finanzas_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-finanzas_user} -d ${POSTGRES_DB:-finanzas_db}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 512M

  # Django Backend
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      args:
        - DEV_MODE=true
    container_name: finanzas_backend
    restart: unless-stopped
    entrypoint: /app/entrypoint.sh
    command: python manage.py runserver 0.0.0.0:8000
    volumes:
      - ./backend:/app:cached
      - backend_static:/app/staticfiles
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    environment:
      - DJANGO_SECRET_KEY=${DJANGO_SECRET_KEY:-django-insecure-dev-key-change-in-production}
      - DJANGO_DEBUG=${DJANGO_DEBUG:-True}
      - DJANGO_ALLOWED_HOSTS=${DJANGO_ALLOWED_HOSTS:-localhost,127.0.0.1,100.112.232.66}
      - POSTGRES_DB=${POSTGRES_DB:-finanzas_db}
      - POSTGRES_USER=${POSTGRES_USER:-finanzas_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-finanzas_password}
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - DATABASE_URL=postgres://${POSTGRES_USER:-finanzas_user}:${POSTGRES_PASSWORD:-finanzas_password}@db:5432/${POSTGRES_DB:-finanzas_db}
      - CORS_ALLOWED_ORIGINS=${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:8081,http://localhost:19006,http://100.112.232.66:8081,http://100.112.232.66:19006,http://100.112.232.66:3000,exp://100.112.232.66:8081}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - finanzas_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/api/health/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Frontend PWA (Expo Web + nginx)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Relative URL: nginx proxies /api → backend, no IP needed
        - EXPO_PUBLIC_API_URL=/api
    container_name: finanzas_frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - finanzas_network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:80/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  # Redis (for Celery if needed)
  redis:
    image: redis:7-alpine
    container_name: finanzas_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks:
      - finanzas_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

networks:
  finanzas_network:
    driver: bridge
    name: finanzas_network

volumes:
  postgres_data:
    name: finanzas_postgres_data
  backend_static:
    name: finanzas_backend_static
  redis_data:
    name: finanzas_redis_data
